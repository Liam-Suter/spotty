[package]
name = "spotty"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1.0"
warp = "0.3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
clap = { version = "4", features = ["derive"] }